<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="Currently: migrating W.I.N.T.E.R. to Apple Silicon, splitting the stack across two machines, tuning local models, shipping small web products"><style>
.dr{animation:dr 1.6s ease-out .2s 1 both}
@keyframes dr{from{stroke-dashoffset:1100}to{stroke-dashoffset:0}}
.pd{animation:pd 2.6s ease-in-out infinite}
.pd2{animation-delay:.5s}.pd3{animation-delay:1s}.pd4{animation-delay:1.5s}
@keyframes pd{0%,100%{opacity:.22}50%{opacity:1}}
.grow{animation:gr 1.4s cubic-bezier(.19,1,.22,1) .4s 1 both;transform-origin:left center}
.g2{animation-delay:.55s}.g3{animation-delay:.7s}.g4{animation-delay:.85s}
@keyframes gr{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transform:none!important}}
</style><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#0b0b0b"/><stop offset="100%" stop-color="#000000"/></linearGradient></defs><rect width="1200" height="300" fill="url(#bg)"/><g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" letter-spacing="4" fill="#8a8a8a"><text x="56" y="46">CURRENTLY</text><text x="1144" y="46" text-anchor="end">2026</text></g><line class="dr" x1="56" y1="64" x2="1144" y2="64" stroke="#ffffff" opacity="0.16" stroke-dasharray="1100"/><g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" fill="#e8e8e8"><circle class="pd" cx="62" cy="112" r="3" fill="#ffffff"/><text x="84" y="117">Migrating W.I.N.T.E.R. from the old Windows box to Apple Silicon</text><circle class="pd pd2" cx="62" cy="156" r="3" fill="#ffffff"/><text x="84" y="161">Splitting the stack across two machines over Tailscale</text><circle class="pd pd3" cx="62" cy="200" r="3" fill="#ffffff"/><text x="84" y="205">Tuning local models so the cloud stays a fallback</text><circle class="pd pd4" cx="62" cy="244" r="3" fill="#ffffff"/><text x="84" y="249">Shipping small web products on the side</text></g><g stroke="#ffffff" stroke-width="2" opacity="0.28"><line class="grow" x1="820" y1="112" x2="1144" y2="112"/><line class="grow g2" x1="820" y1="156" x2="1090" y2="156"/><line class="grow g3" x1="820" y1="200" x2="1010" y2="200"/><line class="grow g4" x1="820" y1="244" x2="950" y2="244"/></g></svg>
