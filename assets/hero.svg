<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560" role="img" aria-label="Rifqi Rizqullah - AI systems builder, local-first agent OS, Bartin Turkiye"><style>
.spin{transform-origin:880px 250px;animation:sp 60s linear infinite}
.orb{transform-origin:880px 250px;animation:sp 22s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.ring{transform-origin:880px 250px;animation:spr 34s linear infinite}
@keyframes spr{to{transform:rotate(-360deg)}}
.sweep{animation:sw 12s ease-in-out infinite}
@keyframes sw{0%{transform:translateX(-380px)}100%{transform:translateX(1500px)}}
.dr{animation:dr 1.8s cubic-bezier(.19,1,.22,1) .25s 1 both}
@keyframes dr{from{stroke-dashoffset:320}to{stroke-dashoffset:0}}
.pd{animation:pd 3s ease-in-out infinite}
@keyframes pd{0%,100%{opacity:.25}50%{opacity:.9}}
.scan{animation:scn 8s linear infinite}
@keyframes scn{from{transform:translateY(-60px)}to{transform:translateY(620px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
