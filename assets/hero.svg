<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="1200" height="520" role="img" aria-label="Rifqi Rizqullah - AI systems builder, local-first agent OS, Bartin Turkiye"><style>
.spin{transform-origin:880px 262px;animation:sp 60s linear infinite}
.spin2{transform-origin:880px 262px;animation:spr 90s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
@keyframes spr{to{transform:rotate(-360deg)}}
.ring{transform-origin:880px 262px;animation:sp 26s linear infinite}
.dash{animation:dd 5s linear infinite}
@keyframes dd{to{stroke-dashoffset:-40}}
.sweep{animation:sw 11s ease-in-out infinite}
@keyframes sw{0%{transform:translateX(-360px)}100%{transform:translateX(1480px)}}
.dr{animation:dr 1.8s cubic-bezier(.19,1,.22,1) .25s 1 both}
@keyframes dr{from{stroke-dashoffset:300}to{stroke-dashoffset:0}}
.pd{animation:pd 3.2s ease-in-out infinite}
@keyframes pd{0%,100%{opacity:.3}50%{opacity:.9}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style><defs><pattern id="d1" width="9" height="9" patternUnits="userSpaceOnUse"><circle cx="4.5" cy="4.5" r="2.7" fill="#ffffff"/></pattern><pattern id="d2" width="9" height="9" patternUnits="userSpaceOnUse"><circle cx="4.5" cy="4.5" r="1.9" fill="#ffffff"/></pattern><pattern id="d3" width="9" height="9" patternUnits="userSpaceOnUse"><circle cx="4.5" cy="4.5" r="1.25" fill="#ffffff"/></pattern><pattern id="d4" width="9" height="9" patternUnits="userSpaceOnUse"><circle cx="4.5" cy="4.5" r="0.75" fill="#ffffff"/></pattern><radialGradient id="vg" cx="72%" cy="46%" r="80%"><stop offset="0%" stop-color="#151515"/><stop offset="100%" stop-color="#000000"/></radialGradient><linearGradient id="swg" x1="0" x2="1"><stop offset="0%" stop-color="#ffffff" stop-opacity="0"/><stop offset="50%" stop-color="#ffffff" stop-opacity="0.06"/><stop offset="100%" stop-color="#ffffff" stop-opacity="0"/></linearGradient><clipPath id="cA"><circle cx="880" cy="262" r="176"/></clipPath><clipPath id="cB"><circle cx="880" cy="262" r="176"/></clipPath></defs><rect width="1200" height="520" fill="url(#vg)"/><rect class="sweep" x="-240" y="0" width="260" height="520" fill="url(#swg)"/><g clip-path="url(#cA)"><g class="spin"><circle cx="880" cy="262" r="176" fill="url(#d4)" opacity="0.5"/><circle cx="856" cy="238" r="132" fill="url(#d3)" opacity="0.6"/><circle cx="838" cy="222" r="92" fill="url(#d2)" opacity="0.75"/><circle cx="826" cy="212" r="52" fill="url(#d1)" opacity="0.95"/></g></g><circle class="ring dash" cx="880" cy="262" r="200" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.28" stroke-dasharray="2 10"/><g class="spin2"><circle cx="880" cy="62" r="3.5" fill="#ffffff"/></g><g class="pd" fill="#ffffff"><circle cx="1130" cy="120" r="1.3"/><circle cx="1090" cy="430" r="1.1"/><circle cx="640" cy="90" r="1.2"/></g><text x="96" y="150" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" letter-spacing="12" fill="#5a6067">AI SYSTEMS BUILDER</text><text x="92" y="256" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="82" font-weight="200" letter-spacing="20" fill="#ffffff">RIFQI</text><text x="96" y="322" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="44" font-weight="200" letter-spacing="18" fill="none" stroke="#ffffff" stroke-width="0.8" opacity="0.8">RIZQULLAH</text><line class="dr" x1="98" y1="362" x2="398" y2="362" stroke="#ffffff" stroke-width="1" opacity="0.26" stroke-dasharray="300"/><text x="98" y="400" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" letter-spacing="3" fill="#8c9298">local-first agent OS</text><text x="98" y="428" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" letter-spacing="3" fill="#8c9298">Bartin, Turkiye</text><g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" letter-spacing="4" fill="#4e545a"><text x="98" y="470">PYTHON</text><text x="196" y="470">FASTAPI</text><text x="306" y="470">PGVECTOR</text><text x="430" y="470">OLLAMA</text></g><g stroke="#ffffff" stroke-width="1.4" opacity="0.26" fill="none"><path d="M40 40 L40 76 M40 40 L76 40"/><path d="M1160 480 L1160 444 M1160 480 L1124 480"/></g></svg>
