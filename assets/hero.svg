<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" width="1200" height="440" role="img" aria-label="Rifqi Rizqullah - AI systems builder, building W.I.N.T.E.R."><style>
.f{opacity:0;animation:f .8s cubic-bezier(.2,.8,.3,1) forwards}
.a1{animation-delay:.15s}.a2{animation-delay:.35s}.a3{animation-delay:.55s}.a4{animation-delay:.75s}.a5{animation-delay:2.6s}
@keyframes f{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.ln{stroke-dasharray:900;stroke-dashoffset:900;animation:ln 1.6s cubic-bezier(.2,.8,.3,1) .7s forwards}
@keyframes ln{to{stroke-dashoffset:0}}
.rv{width:0;animation:rv 2.2s steps(46) 1.3s forwards}
@keyframes rv{to{width:700px}}
.cr{opacity:0;animation:cs .01s linear 1.3s forwards,bl 1.05s steps(1) 1.4s infinite}
@keyframes cs{to{opacity:1}}
@keyframes bl{50%{opacity:0}}
.bm{animation:bm 7s ease-in-out infinite}
@keyframes bm{0%{transform:translateX(-300px)}100%{transform:translateX(1400px)}}
.pd{animation:pd 2.4s ease-in-out infinite}
@keyframes pd{0%,100%{opacity:.3}50%{opacity:1}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;opacity:1!important;transform:none!important;stroke-dashoffset:0!important;width:700px!important}}
</style><defs><pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M48 0 L0 0 0 48" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.045"/></pattern><radialGradient id="vg" cx="50%" cy="42%" r="78%"><stop offset="0%" stop-color="#131313"/><stop offset="100%" stop-color="#000000"/></radialGradient><linearGradient id="bmg" x1="0" x2="1"><stop offset="0%" stop-color="#ffffff" stop-opacity="0"/><stop offset="50%" stop-color="#ffffff" stop-opacity="0.09"/><stop offset="100%" stop-color="#ffffff" stop-opacity="0"/></linearGradient><clipPath id="cp"><rect class="rv" x="250" y="300" height="30"/></clipPath></defs><rect width="1200" height="440" fill="url(#vg)"/><rect width="1200" height="440" fill="url(#grid)"/><rect class="bm" x="-160" y="0" width="220" height="440" fill="url(#bmg)"/><g class="f a1" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" letter-spacing="3" fill="#8a8a8a"><circle class="pd" cx="64" cy="52" r="4" fill="#ffffff"/><text x="80" y="56">SYSTEM ONLINE</text><text x="600" y="56" text-anchor="middle">BARTIN . TURKIYE</text><text x="1136" y="56" text-anchor="end">EEE STUDENT</text></g><line class="ln" x1="56" y1="76" x2="1144" y2="76" stroke="#ffffff" stroke-width="1" opacity="0.16"/><text class="f a2" x="600" y="182" text-anchor="middle" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="76" font-weight="200" letter-spacing="26" fill="#ffffff">RIFQI</text><text class="f a3" x="600" y="248" text-anchor="middle" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="52" font-weight="200" letter-spacing="20" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.85">RIZQULLAH</text><g class="f a4"><line x1="470" y1="276" x2="730" y2="276" stroke="#ffffff" stroke-width="1" opacity="0.3"/></g><g clip-path="url(#cp)"><text x="250" y="322" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="18" fill="#e8e8e8">$ winter run --local --agents 6 --memory pgvector</text></g><rect class="cr" x="952" y="306" width="9" height="19" fill="#ffffff"/><line class="ln" x1="56" y1="368" x2="1144" y2="368" stroke="#ffffff" stroke-width="1" opacity="0.16"/><g class="f a5" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" letter-spacing="4" fill="#6f6f6f"><text x="56" y="400">PYTHON</text><text x="212" y="400">FASTAPI</text><text x="384" y="400">PGVECTOR</text><text x="576" y="400">OLLAMA</text><text x="744" y="400">REDIS</text><text x="888" y="400">DOCKER</text><text x="1056" y="400">N8N</text></g><g stroke="#ffffff" stroke-width="1.5" opacity="0.28" fill="none"><path d="M24 20 L24 56 M24 20 L60 20"/><path d="M1176 20 L1176 56 M1176 20 L1140 20"/><path d="M24 420 L24 384 M24 420 L60 420"/><path d="M1176 420 L1176 384 M1176 420 L1140 420"/></g></svg>
