<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" width="520" height="360" role="img" aria-label="W.I.N.T.E.R. agent core diagram"><style>
.sp{transform-origin:260px 168px;animation:sp 26s linear infinite}
.spr{transform-origin:260px 168px;animation:spr 34s linear infinite}
