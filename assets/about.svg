<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="1200" height="380" role="img" aria-label="W.I.N.T.E.R. system spec: 6 agent roles, local models, vector memory, risk-gated tools"><style>
.c{opacity:0;animation:c .6s cubic-bezier(.2,.8,.3,1) forwards}
@keyframes c{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.h{stroke-dasharray:1100;stroke-dashoffset:1100;animation:h 1.6s ease-out forwards}
@keyframes h{to{stroke-dashoffset:0}}
.o1{transform-origin:930px 200px;animation:sp 30s linear infinite}
.o2{transform-origin:930px 200px;animation:spr 44s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
@keyframes spr{to{transform:rotate(-360deg)}}
.dash{stroke-dasharray:3 9;animation:d 4s linear infinite}
@keyframes d{to{stroke-dashoffset:-24}}
.pd{animation:pd 2.6s ease-in-out infinite}
@keyframes pd{0%,100%{opacity:.25}50%{opacity:.9}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;opacity:1!important;transform:none!important;stroke-dashoffset:0!important}}
