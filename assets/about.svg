<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="1200" height="380" role="img" aria-label="W.I.N.T.E.R. system spec: FastAPI runtime, pgvector memory, Ollama models, six agent roles, risk-gated tools">
