<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="1200" height="380" role="img" aria-label="W.I.N.T.E.R. system spec: FastAPI runtime, pgvector memory, Ollama models, 6 agent roles, risk-gated tools"><style>
.o1{transform-origin:930px 200px;animation:sp 30s linear infinite}
.o2{transform-origin:930px 200px;animation:spr 46s linear infinite}
