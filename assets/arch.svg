<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" role="img" aria-label="W.I.N.T.E.R. architecture: Discord and CLI enter the FastAPI core, which routes to Ollama local models with cloud fallback, pgvector memory, Redis queue and n8n automations"><style>
